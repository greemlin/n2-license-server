{% extends "base.html" %}

{% block title %}Create License Key — N2 License Server{% endblock %}
{% block page_title %}Create License Key{% endblock %}

{% block content %}
<div class="card narrow">
    <form method="post" action="/admin/keys">
        <div class="form-group">
            <label for="edition">Edition</label>
            <input type="text" id="edition" name="edition" value="standard">
        </div>
        <div class="form-row">
            <div class="form-group">
                <label for="activation_limit">Activation Limit</label>
                <input type="number" id="activation_limit" name="activation_limit" value="1" min="1">
            </div>
            <div class="form-group">
                <label for="offline_grace_days">Offline Grace Days</label>
                <input type="number" id="offline_grace_days" name="offline_grace_days" value="10" min="1">
            </div>
        </div>
        <div class="form-group">
            <label for="expires_at">Expiration Date</label>
            <input type="date" id="expires_at" name="expires_at">
        </div>
        <div class="form-check">
            <input type="checkbox" id="never_expires" name="never_expires" value="1" checked>
            <label for="never_expires">Never expires</label>
        </div>
        <div class="form-group">
            <label for="label">Label / Customer</label>
            <input type="text" id="label" name="label" placeholder="Optional customer name">
        </div>
        <div class="form-group">
            <label for="note">Note</label>
            <textarea id="note" name="note" rows="3"></textarea>
        </div>
        <button type="submit" class="btn btn-primary">Generate Key</button>
        <a href="/admin/keys" class="btn btn-secondary">Cancel</a>
    </form>
</div>
{% endblock %}
