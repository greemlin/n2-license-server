{% set pages = ((total + per_page - 1) // per_page) %}
<div class="pagination"><span class="muted">{{ total }} records · page {{ page }} / {{ pages if pages else 1 }}</span><span>{% if page > 1 %}<a class="btn btn-secondary btn-sm" href="?page={{ page - 1 }}&per_page={{ per_page }}&q={{ q }}&sort={{ sort }}&direction={{ direction }}{% if show_deleted %}&show_deleted=true{% endif %}">Previous</a>{% endif %}{% if page < pages %}<a class="btn btn-secondary btn-sm" href="?page={{ page + 1 }}&per_page={{ per_page }}&q={{ q }}&sort={{ sort }}&direction={{ direction }}{% if show_deleted %}&show_deleted=true{% endif %}">Next</a>{% endif %}</span></div>
