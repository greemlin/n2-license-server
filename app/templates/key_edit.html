{% extends "base.html" %}

{% block title %}Edit License Key — N2 License Server{% endblock %}
{% block page_title %}Edit License Key{% endblock %}

{% block content %}
<div class="card narrow">
    <p class="muted">Key: <strong class="mono">{{ key.key_text }}</strong></p>
    <form method="post" action="/admin/keys/{{ key.id }}/edit">
        <div class="form-row">
            <div class="form-group">
                <label for="activation_limit">Activation Limit</label>
                <input type="number" id="activation_limit" name="activation_limit" value="{{ key.activation_limit }}" min="1">
            </div>
            <div class="form-group">
                <label for="offline_grace_days">Offline Grace Days</label>
                <input type="number" id="offline_grace_days" name="offline_grace_days" value="{{ key.offline_grace_days }}" min="1">
            </div>
        </div>
        <div class="form-group">
            <label for="expires_at">Expiration Date</label>
            <input type="date" id="expires_at" name="expires_at" value="{{ key.expires_at.strftime('%Y-%m-%d') if key.expires_at else '' }}">
        </div>
        <div class="form-check">
            <input type="checkbox" id="never_expires" name="never_expires" value="1" {% if not key.expires_at %}checked{% endif %}>
            <label for="never_expires">Never expires</label>
        </div>
        <div class="form-group">
            <label for="label">Label / Customer</label>
            <input type="text" id="label" name="label" value="{{ key.label or '' }}" placeholder="Optional customer name">
        </div>
        <div class="form-group">
            <label for="note">Note</label>
            <textarea id="note" name="note" rows="3">{{ key.note or '' }}</textarea>
        </div>
        <button type="submit" class="btn btn-primary">Save Changes</button>
        <a href="/admin/keys/{{ key.id }}" class="btn btn-secondary">Cancel</a>
    </form>
</div>
{% endblock %}
