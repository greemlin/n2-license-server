# Coolify production compose
# Do NOT expose host ports here; Coolify's reverse proxy routes to container port 8000.
services:
  license-server:
    build: .
    container_name: n2-license-server
    restart: unless-stopped
    environment:
      - DATABASE_URL=sqlite:///./data/license_server.db
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD_HASH=${ADMIN_PASSWORD_HASH}
      - SECRET_KEY=${SECRET_KEY}
      - DEFAULT_OFFLINE_GRACE_DAYS=${DEFAULT_OFFLINE_GRACE_DAYS:-10}
      - DEFAULT_ACTIVATION_LIMIT=${DEFAULT_ACTIVATION_LIMIT:-1}
      - DEBUG=false
      - SENTRY_DSN=${SENTRY_DSN:-}
    volumes:
      - license-server-data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/admin/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  license-server-data:
