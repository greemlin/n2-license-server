# Local development compose
# Binds port 8000 to localhost only.
services:
  license-server:
    build: .
    container_name: n2-license-server
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./data/license_server.db
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD_HASH=${ADMIN_PASSWORD_HASH}
      - SECRET_KEY=${SECRET_KEY}
      - DEFAULT_OFFLINE_GRACE_DAYS=${DEFAULT_OFFLINE_GRACE_DAYS:-10}
      - DEFAULT_ACTIVATION_LIMIT=${DEFAULT_ACTIVATION_LIMIT:-1}
      - DEBUG=false
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/admin/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
